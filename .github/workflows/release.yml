# Release: deliberate version-tag publication, and no secret leaves this repository.
#
# Pushing a version tag `vX.Y.Z` on `main` (or dispatching `release.yml` on an
# existing tag to recover a failed canonical publish) validates the tag, commit
# SHA, `origin/main` ancestry and `package.json` version, then publishes to npm
# over OIDC (trusted publishing) — no npm token, no OTP. It
# publishes the package three times (#65, #98): `@rig-c/play`, the name in
# package.json, then `rig-play` (1.0–1.8) and `spine-html` (0.x), the names it
# shipped under before, kept as aliases carrying the same files at every version.
# No pre-existing GitHub Release is required, so a failed publish can recover
# before release notes are created.
#
# Two constraints are load-bearing, do not "simplify" them away:
#   - Every publish must stay in THIS file. npm's trusted publisher for each
#     name — @rig-c/play, rig-play and spine-html, one form per package on
#     npmjs.com, each naming the repository rig-c/play — is pinned to the
#     workflow filename `release.yml`.
#   - It must stay on a GitHub-hosted runner. npm does not support OIDC from
#     self-hosted runners.
name: release

on:
  push:
    tags:
      - 'v*'
  # The aliases on their own (#65): when the cut published `@rig-c/play` and an
  # alias publish failed after it — the first rig-play cut did, on a
  # trusted-publisher form that still named the repository's old path — the
  # release job cannot be re-run, because its first publish would now be
  # refused as an existing version before the alias step is reached. This path
  # publishes only the aliases named, from the tarball the registry serves for
  # `@rig-c/play` at that version (never from a rebuild), and takes the same
  # confirmation.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag whose @rig-c/play publish failed (vX.Y.Z); leave alias_version empty'
        required: false
        type: string
      alias_version:
        description: 'Version already published as @rig-c/play (e.g. 1.9.0) to repair aliases; leave tag empty'
        required: false
        type: string
      alias_names:
        description: 'Which aliases to publish, space-separated (an alias already at that version would be refused)'
        required: true
        default: 'rig-play spine-html'
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # 20 minutes covered the publish. Confirmation has one shared 15-minute
    # window for all names.
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
    steps:
      # Bind every publish path to an immutable commit before checkout.
      # A partial alias failure still uses the registry tarball in the alias job;
      # tag publication/retry never republishes or selectively skips an existing canonical.
      - name: Resolve the release target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          ALIAS_VERSION: ${{ inputs.alias_version }}
          ALIAS_NAMES: ${{ inputs.alias_names }}
          RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          resolve_commit() {
            # Explicit tags/ disambiguates a same-named branch. The commits API
            # peels annotated tags as well as lightweight tags to a commit SHA.
            if ! tag_sha="$(gh api "repos/$REPO/commits/refs%2Ftags%2F$release_tag" --jq .sha)"; then
              echo "::error::RELEASE_TAG_UNRESOLVED: cannot resolve $release_tag to a commit"
              exit 1
            fi
            if ! [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::RELEASE_TAG_UNRESOLVED: $release_tag did not resolve to a full commit SHA"
              exit 1
            fi
            if [ -z "${RUN_SHA:-}" ] || [ "$RUN_SHA" != "$tag_sha" ]; then
              if [ "$target_mode" = alias ]; then
                printf -v recovery 'gh workflow run release.yml --repo %q --ref %q -f alias_version=%q -f alias_names=%q' "$REPO" "$release_tag" "$ALIAS_VERSION" "$ALIAS_NAMES"
              else
                printf -v recovery 'gh workflow run release.yml --repo %q --ref %q -f tag=%q' "$REPO" "$release_tag" "$release_tag"
              fi
              echo "::error::PROVENANCE_SHA_MISMATCH: the run's GITHUB_SHA ${RUN_SHA:-<missing>} is not $release_tag's commit $tag_sha; the tag remains cut; recover with $recovery"
              exit 1
            fi
          }
          if [ "$EVENT" = push ]; then
            if [[ "${REF:-}" != refs/tags/* ]]; then
              echo "::error::RELEASE_TAG_FORM: push ref must be refs/tags/vX.Y.Z"
              exit 1
            fi
            release_tag="${REF#refs/tags/}"
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$INPUT_TAG" ] && [ -n "$ALIAS_VERSION" ]; then
              echo "::error::RELEASE_MODE: supply tag or alias_version, never both"
              exit 1
            fi
            if [ -z "$INPUT_TAG" ]; then
              if ! [[ "$ALIAS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::RELEASE_MODE: supply tag or a numeric alias_version (X.Y.Z)"
                exit 1
              fi
              release_tag="v$ALIAS_VERSION"
              target_mode=alias
              resolve_commit
              echo "mode=alias" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=$tag_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release_tag="$INPUT_TAG"
          else
            echo "::error::RELEASE_MODE: unsupported event ${EVENT:-<missing>}"
            exit 1
          fi
          if ! [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::RELEASE_TAG_FORM: tag must be vX.Y.Z"
            exit 1
          fi
          if [ "${REF:-}" != "refs/tags/$release_tag" ]; then
            echo "::error::RELEASE_REF_NOT_TAG: workflow ref ${REF:-<missing>} must be refs/tags/$release_tag"
            exit 1
          fi
          version="${release_tag#v}"
          registry_result="$RUNNER_TEMP/release-registry.json"
          if npm view "@rig-c/play@$version" version --json --registry=https://registry.npmjs.org > "$registry_result"; then
            echo "::error::RELEASE_ALREADY_PUBLISHED: canonical version is served; use alias_version for missing aliases"
            exit 1
          fi
          # Only npm's explicit E404 means absent. An outage, permission error,
          # malformed response or an unknown failure must not permit publishing.
          if ! node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(r.error?.code === "E404" ? 0 : 1)' "$registry_result"; then
            echo "::error::RELEASE_REGISTRY_LOOKUP: canonical absence could not be verified"
            exit 1
          fi
          target_mode=tag
          resolve_commit
          echo "mode=tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$tag_sha" >> "$GITHUB_OUTPUT"

      # The original gate, publish and confirmation steps serve both paths.
      - uses: actions/checkout@v4
        if: ${{ steps.target.outputs.publish == 'true' }}
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}

      # A public release alone cannot authorize a tag from an off-main commit.
      - name: Verify the retry tag is on main
        if: ${{ steps.target.outputs.mode == 'tag' }}
        run: |
          set -euo pipefail
          if ! shallow="$(git rev-parse --is-shallow-repository)"; then
            echo "::error::RELEASE_TAG_ANCESTRY_LOOKUP: cannot determine checkout history depth"
            exit 1
          fi
          fetch_args=(--no-tags)
          case "$shallow" in
            true) fetch_args+=(--unshallow) ;;
            false) ;;
            *) echo "::error::RELEASE_TAG_ANCESTRY_LOOKUP: unknown checkout history depth"; exit 1 ;;
          esac
          if ! git fetch "${fetch_args[@]}" origin refs/heads/main:refs/remotes/origin/main; then
            echo "::error::RELEASE_TAG_MAIN_FETCH: cannot fetch complete main history"
            exit 1
          fi
          if git merge-base --is-ancestor HEAD origin/main; then
            :
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "::error::RELEASE_TAG_NOT_ON_MAIN: checked-out tag commit is not on main"
            else
              echo "::error::RELEASE_TAG_ANCESTRY_LOOKUP: cannot verify checked-out tag ancestry"
            fi
            exit 1
          fi

      # npm provenance names the run's SHA, not the checkout. Dispatch on the
      # tag; only tags carrying this guard can safely use this recovery path.
      - name: Verify the dispatched source commit
        if: ${{ steps.target.outputs.mode == 'tag' }}
        env:
          RUN_SHA: ${{ github.sha }}
          TAG_NAME: ${{ steps.target.outputs.tag }}
          MODE: ${{ steps.target.outputs.mode }}
          REPO: ${{ github.repository }}
          ALIAS_VERSION: ${{ inputs.alias_version }}
          ALIAS_NAMES: ${{ inputs.alias_names }}
        run: &provenance_source_guard |
          set -euo pipefail
          if ! checkout_sha="$(git rev-parse --verify 'HEAD^{commit}')" || [ -z "$checkout_sha" ]; then
            echo "::error::PROVENANCE_SHA_LOOKUP: cannot resolve the checked-out HEAD commit"
            exit 1
          fi
          if [ -z "${RUN_SHA:-}" ] || [ "$RUN_SHA" != "$checkout_sha" ]; then
            if [ "$MODE" = alias ]; then
              printf -v recovery 'gh workflow run release.yml --repo %q --ref %q -f alias_version=%q -f alias_names=%q' "$REPO" "$TAG_NAME" "$ALIAS_VERSION" "$ALIAS_NAMES"
            else
              printf -v recovery 'gh workflow run release.yml --repo %q --ref %q -f tag=%q' "$REPO" "$TAG_NAME" "$TAG_NAME"
            fi
            echo "::error::PROVENANCE_SHA_MISMATCH: the run's GITHUB_SHA ${RUN_SHA:-<missing>} is not $TAG_NAME's checked-out HEAD $checkout_sha, and npm provenance would name the former; recover with $recovery"
            exit 1
          fi

      # Refuse a moved/mistyped tag before prepublishOnly can build or publish.
      - name: Verify the retry tag matches the package
        if: ${{ steps.target.outputs.mode == 'tag' }}
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "@rig-c/play" || `v${p.version}` !== process.env.TAG_NAME) { console.error("::error::RELEASE_TAG_VERSION: checked-out package does not match the release tag"); process.exit(1); }'

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.target.outputs.publish == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.target.outputs.publish == 'true' }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC exchange landed in npm 11.5.1.
      # CI installs the same version; the two must stay equal.
      - name: Use an npm that speaks OIDC
        if: ${{ steps.target.outputs.publish == 'true' }}
        run: |
          npm install -g npm@12.2.2
          npm --version

      - name: Install dependencies
        if: ${{ steps.target.outputs.publish == 'true' }}
        run: bun install --frozen-lockfile

      # Build the verified tagged tree once. Publish and derive aliases from
      # the same tarball, whose manifest omits the checkout-only source entry.
      - name: Build and pack the release tarball
        id: pack
        if: ${{ steps.target.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          npm run build:lib
          tarball="$(node scripts/pack-release.mjs "$RUNNER_TEMP/canonical")"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish @rig-c/play
        if: ${{ steps.target.outputs.publish == 'true' }}
        env:
          CANONICAL_TGZ: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$CANONICAL_TGZ" --provenance --access public --ignore-scripts

      - name: Publish the aliases rig-play and spine-html
        if: ${{ steps.target.outputs.publish == 'true' }}
        env:
          CANONICAL_TGZ: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          for alias in rig-play spine-html; do
            alias_tgz="$(node scripts/alias-tarball.mjs pack --alias "$alias" --out "$RUNNER_TEMP/alias-$alias" --tarball "$CANONICAL_TGZ")"
            npm publish "$alias_tgz" --provenance --access public --ignore-scripts
          done

      # Compare the exact registry version under all three names.
      - name: Confirm every name serves the same files
        if: ${{ steps.target.outputs.publish == 'true' }}
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: node scripts/confirm-registry.mjs "${TAG_NAME#v}"

      - name: Render the published installation in Chromium
        if: ${{ steps.target.outputs.publish == 'true' }}
        timeout-minutes: 10
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          bun run fetch-assets
          bunx playwright install --with-deps chromium
          version="${TAG_NAME#v}"
          node scripts/install-smoke.mjs --spec "@rig-c/play@$version"

  # Alias repair only: a tag retry cannot enter this job.
  alias:
    needs: release
    if: ${{ needs.release.outputs.mode == 'alias' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    env:
      ALIAS_VERSION: ${{ inputs.alias_version }}
      ALIASES: ${{ inputs.alias_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.checkout_ref }}

      - name: Verify the dispatched source commit
        env:
          RUN_SHA: ${{ github.sha }}
          TAG_NAME: v${{ inputs.alias_version }}
          MODE: alias
          REPO: ${{ github.repository }}
          ALIAS_VERSION: ${{ inputs.alias_version }}
          ALIAS_NAMES: ${{ inputs.alias_names }}
        run: *provenance_source_guard

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # CI installs the same version; the two must stay equal.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@12.2.2
          npm --version

      # The source is the registry's own `@rig-c/play@<version>` tarball (npm
      # names it `rig-c-play-<version>.tgz`), so each alias is that publish's
      # files whatever the checkout holds; the script rewrites the one name
      # line and holds the result to it file by file.
      - name: Publish the named aliases from the registry's @rig-c/play tarball
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"
          mkdir -p "$src"
          npm pack "@rig-c/play@$ALIAS_VERSION" --pack-destination "$src" --loglevel=error
          for alias in $ALIASES; do
            alias_tgz="$(node scripts/alias-tarball.mjs pack --alias "$alias" --out "$RUNNER_TEMP/alias-$alias" --tarball "$src"/rig-c-play-*.tgz)"
            npm publish "$alias_tgz" --provenance --access public --ignore-scripts
          done

      - name: Confirm every name serves the same files
        run: |
          set -euo pipefail
          selection="${ALIASES:-rig-play spine-html}"
          IFS=$' \t' read -r -a aliases <<< "${selection//$'\n'/ }"
          if [ "${#aliases[@]}" -eq 0 ]; then
            echo '::error::alias_names must name at least one alias'
            exit 2
          fi
          node scripts/confirm-registry.mjs "$ALIAS_VERSION" "${aliases[@]}"
