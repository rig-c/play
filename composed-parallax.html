<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@rig-c/play — composed take camera</title>
    <style>
      :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; background: #f7f5ef; color: #24312d; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 52rem; margin-inline: auto; padding: clamp(1rem, 5vw, 3rem); }
      h1 { margin: 0 0 1.25rem; font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 650; line-height: 1.2; }
      .controls { display: flex; flex-wrap: wrap; gap: .75rem 1rem; }
      label { display: grid; gap: .25rem; }
      select { padding: .35rem .55rem; border: 1px solid #a4ada5; border-radius: .25rem; background: #fff; color: inherit; font: inherit; }
      #status { margin: 1rem 0 1.5rem; min-height: 1.5em; }
      #status[data-refused] { color: #963517; }
      .review { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.5rem; }
      #stage { width: 128px; height: 128px; outline: 1px solid #a4ada5; background: #f0d7d2; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { padding: .25rem .65rem; border-bottom: 1px solid #d6dbd2; text-align: left; }
      th { font-weight: 550; }
      td { white-space: nowrap; }
      .source { margin-block: 2rem 0; }
      a { color: #235b4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Composed take camera</h1>
      <div class="controls">
        <label>Public fixture
          <select id="fixture">
            <option value="original">Original plate</option>
            <option value="overscan" selected>Overscan plate</option>
            <option value="clip">Overscan with stage clip</option>
          </select>
        </label>
        <label>Camera
          <select id="camera-mode" disabled>
            <option value="fixed">Fixed</option>
            <option value="parallax">Parallax</option>
            <option value="pan">Pan (equal gains)</option>
          </select>
        </label>
      </div>
      <p id="status" role="status">Loading the composed take…</p>
      <div class="review">
        <div id="stage"></div>
        <table aria-label="Camera excursion and plane shifts in CSS pixels">
          <thead><tr><th scope="col">CSS pixels (X, Y)</th><th scope="col">Current</th><th scope="col">Selected max ±</th></tr></thead>
          <tbody>
            <tr><th scope="row">Camera (+Y up)</th><td id="camera-position">—</td><td id="camera-limit">—</td></tr>
            <tr><th scope="row">Background</th><td id="background-shift">—</td><td id="background-limit">—</td></tr>
            <tr><th scope="row">Figure</th><td id="figure-shift">—</td><td id="figure-limit">—</td></tr>
            <tr><th scope="row">Foreground</th><td id="foreground-shift">—</td><td id="foreground-limit">—</td></tr>
          </tbody>
        </table>
      </div>
      <p class="source">Plane shifts use screen axes (+Y down). <a href="https://github.com/rig-c/create/tree/ed949ef5a44e443a89f640ab0d6b8f8fac0ca1ae/templates/example-composed-direction">Public Create source</a> · <a href="tests/fixtures/composed-direction/LICENSE.txt">MIT license</a></p>
    </main>
    <script type="module" src="/samples/composed-parallax.ts"></script>
  </body>
</html>
